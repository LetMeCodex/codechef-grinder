name: CodeChef Practice Auto-Grinder

on:
  schedule:
    # 4 Randomized Human Time-Slots per day (IST = UTC + 5:30)
    # 1. Morning (~10:17 AM IST)
    - cron: '47 4 * * *'
    # 2. Afternoon (~02:34 PM IST)
    - cron: '4 9 * * *'
    # 3. Evening (~07:18 PM IST)
    - cron: '48 13 * * *'
    # 4. Late Night (~11:21 PM IST)
    - cron: '51 17 * * *'

  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions

permissions:
  contents: write

jobs:
  grind-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CodeChef Practice Grinder (Randomized Mode)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CODECHEF_SESSION: ${{ secrets.CODECHEF_SESSION }}
          RANDOMIZE_BATCH: "true"
          MIN_PROBLEMS_PER_RUN: "2"
          MAX_PROBLEMS_PER_RUN: "5"
          DAILY_TARGET_MIN: "8"
          DAILY_TARGET_MAX: "20"
          MIN_DELAY_SECONDS: "40"
          MAX_DELAY_SECONDS: "110"
          LANGUAGE: "cpp"
          MIN_DIFFICULTY: "200"
          MAX_DIFFICULTY: "1400"
        run: |
          python -m src.runner

      - name: Commit & Push Solved Solutions
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Grinded CodeChef Practice Problems [skip ci]"
          file_pattern: "."
          commit_user_name: "CodeChef Grinder Bot"
          commit_user_email: "actions@github.com"
          commit_author: "CodeChef Grinder Bot <actions@github.com>"
